---
name: Publish to npm

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${TAG_VER}" != "${PKG_VER}" ]; then
            echo "::error::Tag version ${TAG_VER} != package.json ${PKG_VER}"
            exit 1
          fi
          echo "Tag version ${TAG_VER} matches package.json"

      - name: Install dev dependencies & run full checks
        run: |
          npm install
          npx tsc -p tsconfig.json --noEmit
          npm test
          npm pack --dry-run

      - name: Upgrade npm CLI for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Publish public pi-package to npm (idempotent)
        run: |
          PKG_VER=$(npm pkg get version | tr -d '"')
          if npm view "pi-cdp@${PKG_VER}" version >/dev/null 2>&1; then
            echo "pi-cdp@${PKG_VER} already published — skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
